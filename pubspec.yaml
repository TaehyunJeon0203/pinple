name: pinple
description: "공주대학교 천안캠퍼스 전용 소모임 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # State Management
  flutter_riverpod: any

  # Navigation
  go_router: any

  # Map
  flutter_naver_map: any

  # Location
  geolocator: any
  permission_handler: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
